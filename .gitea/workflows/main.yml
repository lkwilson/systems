name: Build snapshot

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  amd64:
    runs-on: brew7
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate image tag
        id: tag
        run: |
          TAG=$(git describe --tags --always)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Generated tag: $TAG"
      - name: Set up Docker Buildx
        run: |
          docker context create builders --docker "host=tcp://localhost:2375"
          docker buildx create --name mybuilder --use builders
      - name: Build and push (amd64)
        run: |
          REG='${{ secrets.DOCKER_REG_URL }}'
          NAME="${GITHUB_REPOSITORY##*/}"
          echo '${{ secrets.DOCKER_REG_PW }}' | docker login "$REG" -u '${{ secrets.DOCKER_REG_UN }}' --password-stdin
          docker buildx build --platform linux/amd64 \
            -t "$REG/library/${NAME}:${{ steps.tag.outputs.tag }}-amd64" \
            --push .

  arm64:
    needs: amd64
    runs-on: brew7
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        run: |
          docker context create builders --docker "host=tcp://localhost:2375"
          docker buildx create --name mybuilder --use builders
      - name: Build and push (arm64)
        run: |
          REG='${{ secrets.DOCKER_REG_URL }}'
          NAME="${GITHUB_REPOSITORY##*/}"
          echo '${{ secrets.DOCKER_REG_PW }}' | docker login "$REG" -u '${{ secrets.DOCKER_REG_UN }}' --password-stdin
          docker buildx build --platform linux/arm64 \
            -t "$REG/library/${NAME}:${{ needs.amd64.outputs.tag }}-arm64" \
            --push .

  manifest:
    needs: [amd64, arm64]
    runs-on: brew7
    steps:
      - name: Combine into multi-arch manifest
        run: |
          REG='${{ secrets.DOCKER_REG_URL }}'
          NAME="${GITHUB_REPOSITORY##*/}"
          TAG="${{ needs.amd64.outputs.tag }}"
          echo '${{ secrets.DOCKER_REG_PW }}' | docker login "$REG" -u '${{ secrets.DOCKER_REG_UN }}' --password-stdin
          docker buildx imagetools create \
            -t "$REG/library/${NAME}:${TAG}" \
            "$REG/library/${NAME}:${TAG}-amd64" \
            "$REG/library/${NAME}:${TAG}-arm64"
