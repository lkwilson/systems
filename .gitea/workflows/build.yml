name: Build and push release image

on:
  push:
    tags: ["[0-9]*.[0-9]*.[0-9]*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  amd64:
    runs-on: brew7
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Get tag
        id: tag
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        run: |
          docker context create builders --docker "host=tcp://localhost:2375"
          docker buildx create --name mybuilder --use builders
      - name: Build and push (amd64)
        run: |
          REG='zot.endsy.me'
          NAME="${GITHUB_REPOSITORY##*/}"
          TAG="${GITHUB_REF_NAME}"
          docker buildx build --platform linux/amd64 \
            -t "$REG/library/${NAME}:${TAG}-amd64" \
            -t "$REG/library/${NAME}:latest-amd64" \
            --push .

  arm64:
    needs: amd64
    runs-on: brew7
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        run: |
          docker context create builders --docker "host=tcp://localhost:2375"
          docker buildx create --name mybuilder --use builders
      - name: Build and push (arm64)
        run: |
          REG='zot.endsy.me'
          NAME="${GITHUB_REPOSITORY##*/}"
          TAG="${{ needs.amd64.outputs.tag }}"
          docker buildx build --platform linux/arm64 \
            -t "$REG/library/${NAME}:${TAG}-arm64" \
            -t "$REG/library/${NAME}:latest-arm64" \
            --push .

  manifest:
    needs: [amd64, arm64]
    runs-on: brew7
    steps:
      - name: Combine into multi-arch manifests
        run: |
          REG='zot.endsy.me'
          NAME="${GITHUB_REPOSITORY##*/}"
          TAG="${{ needs.amd64.outputs.tag }}"
          for base in "$TAG" latest; do
            docker buildx imagetools create \
              -t "$REG/library/${NAME}:${base}" \
              "$REG/library/${NAME}:${base}-amd64" \
              "$REG/library/${NAME}:${base}-arm64"
          done
