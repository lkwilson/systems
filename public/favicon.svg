<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b" />
      <stop offset="1" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399" />
      <stop offset="1" stop-color="#059669" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#bg)" />
  <!-- gauge: a maintenance-deficit meter -->
  <g fill="none" stroke-linecap="round">
    <!-- track -->
    <path d="M7 22 A9 9 0 0 1 25 22" stroke="#334155" stroke-width="3" />
    <!-- filled arc -->
    <path d="M7 22 A9 9 0 0 1 20.5 14.2" stroke="url(#arc)" stroke-width="3" />
  </g>
  <!-- needle -->
  <g>
    <path d="M16 22 L20 15.5" stroke="#a7f3d0" stroke-width="1.6" stroke-linecap="round" />
    <circle cx="16" cy="22" r="2.1" fill="#a7f3d0" />
    <circle cx="16" cy="22" r="1" fill="#0f172a" />
  </g>
</svg>
